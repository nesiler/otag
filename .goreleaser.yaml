# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: otag

before:
  hooks:
    - go mod tidy

builds:
  - id: otag
    main: ./cmd/otag
    binary: otag
    env:
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: [arm64, amd64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: otag
    formats: [tar.gz]
    name_template: "otag_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

changelog:
  sort: asc
  use: git
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs?:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - '^style:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: nesiler
    name: otag
  prerelease: auto

# Homebrew: a source-building formula is published to nesiler/homebrew-tap by
# .github/workflows/release.yml (scripts/homebrew-formula.sh), not by GoReleaser.
