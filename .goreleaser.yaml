# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: otag

before:
  hooks:
    - go mod tidy

builds:
  - id: otag
    main: ./cmd/otag
    binary: otag
    env:
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: [arm64, amd64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: otag
    formats: [tar.gz]
    name_template: "otag_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

changelog:
  sort: asc
  use: git
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs?:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - '^style:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: nesiler
    name: otag
  prerelease: auto

# Binaries are not signed or notarized, so the cask strips the quarantine flag.
homebrew_casks:
  - name: otag
    repository:
      owner: nesiler
      name: homebrew-tap
      token: '{{ index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}'
    homepage: https://github.com/nesiler/otag
    description: Coordinate AI coding agents (Claude Code, Codex, OpenCode) through tmux
    license: MIT
    commit_msg_template: "chore: update {{ .ProjectName }} to {{ .Tag }}"
    # Skip cleanly when the tap token is not configured.
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/otag"]
          end
